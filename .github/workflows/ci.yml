name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint · test (coverage ≥80%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradeforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tradeforge_test
      REDIS_URL: redis://localhost:6379
      # KMS is not exercised by any test — a syntactically valid dummy ARN satisfies
      # settings validation without making any real AWS calls.
      KMS_KEY_ARN: arn:aws:kms:ap-south-1:000000000000:key/ci-dummy  # Optional — KMS deferred to Phase 2; field now defaults to "" in settings.py
      KMS_ENDPOINT_URL: ""
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY: ci-secret-not-for-production
      SECURE_COOKIES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit

      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Prepare database (extension + roles)
        working-directory: backend
        run: |
          python - <<'PYEOF'
          import asyncio, os, asyncpg
          async def main():
              url = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
              conn = await asyncpg.connect(url)
              await conn.execute("CREATE EXTENSION IF NOT EXISTS btree_gist")
              # Migrations GRANT to tradeforge_app; create it if absent (CI-only)
              await conn.execute("""
                  DO $$ BEGIN
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tradeforge_app') THEN
                      CREATE ROLE tradeforge_app;
                    END IF;
                  END $$;
              """)
              await conn.close()
              print("db prep: ok")
          asyncio.run(main())
          PYEOF

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage gate (≥80%)
        working-directory: backend
        run: >-
          python -m pytest
          --cov=tradeforge
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend — lint · type-check · test (coverage ≥80%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests with coverage gate (≥80%)
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  deploy-staging:
    name: Deploy to Railway staging
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only on push to main — not PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy backend (intuitive-education)
        run: railway redeploy --service intuitive-education --yes

      - name: Redeploy frontend (distinguished-creativity)
        run: railway redeploy --service distinguished-creativity --yes

      # Polls /health until 200 or times out (3 min).
      # Requires RAILWAY_BACKEND_URL secret — skipped if not set.
      # Find the URL: Railway dashboard → intuitive-education service → Settings → Networking → Domain.
      - name: Verify backend health after deploy
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          if [ -z "$RAILWAY_BACKEND_URL" ]; then
            echo "WARNING: RAILWAY_BACKEND_URL secret not set — skipping post-deploy health check."
            echo "Add RAILWAY_BACKEND_URL to GitHub repo secrets (Settings → Secrets → Actions)."
            echo "Value: copy the domain from Railway dashboard → intuitive-education → Settings → Networking."
            exit 0
          fi
          echo "Polling ${RAILWAY_BACKEND_URL}/health (18 attempts × 10s = 3 min max)..."
          for i in $(seq 1 18); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${RAILWAY_BACKEND_URL}/health" 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "Backend healthy on attempt ${i} — deploy verified."
              exit 0
            fi
            echo "Attempt ${i}/18: HTTP ${HTTP} — waiting 10s..."
            sleep 10
          done
          echo "ERROR: Backend did not return HTTP 200 within 3 minutes at ${RAILWAY_BACKEND_URL}/health"
          echo "Check Railway logs: dashboard → intuitive-education → Deployments → latest → View Logs"
          exit 1
