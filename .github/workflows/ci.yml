name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint · test (coverage ≥80%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradeforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tradeforge_test
      REDIS_URL: redis://localhost:6379
      # KMS is not exercised by any test — a syntactically valid dummy ARN satisfies
      # settings validation without making any real AWS calls.
      KMS_KEY_ARN: arn:aws:kms:ap-south-1:000000000000:key/ci-dummy
      KMS_ENDPOINT_URL: ""
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY: ci-secret-not-for-production
      SECURE_COOKIES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Create btree_gist extension
        working-directory: backend
        run: |
          python - <<'PYEOF'
          import asyncio, os, asyncpg
          async def main():
              url = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
              conn = await asyncpg.connect(url)
              await conn.execute("CREATE EXTENSION IF NOT EXISTS btree_gist")
              await conn.close()
              print("btree_gist: ok")
          asyncio.run(main())
          PYEOF

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage gate (≥80%)
        working-directory: backend
        run: >-
          python -m pytest
          --cov=tradeforge
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend — lint · type-check · test (coverage ≥80%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests with coverage gate (≥80%)
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
