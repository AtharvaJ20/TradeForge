[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names.
# Default: %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path is prepended with this value when running `alembic`
prepend_sys_path = .

# Timezone for file naming
timezone = Asia/Kolkata

# Max length of the "slug" portion of a migration filename.
truncate_slug_length = 40

# Revision environment variable
revision_environment = false

# Sourceless migration scripts (don't check for .py source)
sourceless = false

# Version path separator; "os" uses os.pathsep.
version_path_separator = os

# sqlalchemy.url is NOT set here — it is read from DATABASE_URL env var
# at runtime in alembic/env.py. Do not commit credentials here.
# sqlalchemy.url =

[post_write_hooks]
# Run ruff formatter on every generated migration file.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
